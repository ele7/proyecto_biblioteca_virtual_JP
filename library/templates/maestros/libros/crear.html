{% extends "base.html" %}
{% block title %}Crear Categoría{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto space-y-6">

  <h1 class="font-serif text-navy text-2xl font-bold">Crear Categoría</h1>

  <div class="bg-white rounded-xl shadow-bv-sm border border-stone-100 p-6">
    <form method="POST" class="space-y-5">
      {% csrf_token %}
      <div class="space-y-1">
        <label for="nombre"
               class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">
          Nombre de la categoría
        </label>
        <input type="text" id="nombre" name="nombre" required
               class="w-full px-3.5 py-2.5 text-sm border border-stone-200 rounded-lg focus:outline-none focus:border-navy transition-colors" />
      </div>
      <div class="flex items-center gap-3 pt-2">
        <button type="submit"
                class="inline-flex items-center gap-2 bg-navy hover:bg-navy-light text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-colors">
          <i class="fas fa-save"></i> Guardar
        </button>
        <a href="{% url 'library:categorias_listar' %}"
           class="inline-flex items-center gap-2 border border-stone-200 text-navy text-sm font-medium px-5 py-2.5 rounded-xl hover:bg-navy hover:text-white hover:border-navy transition-colors"
           style="text-decoration:none">
          Cancelar
        </a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
