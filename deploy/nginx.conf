# =============================================================================
# Nginx — Configuración de producción
# Dominio : www.ministeriopozodejacob.cl
# Servidor: Ubuntu + Nginx 1.24.x
# Backend : Gunicorn (socket Unix)
# SSL     : Let's Encrypt (Certbot)
#
# Instalación:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/biblioteca_jp
#   sudo ln -sf /etc/nginx/sites-available/biblioteca_jp \
#               /etc/nginx/sites-enabled/biblioteca_jp
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── Oculta la versión de Nginx en headers y páginas de error ─────────────────
# (también debe estar en /etc/nginx/nginx.conf a nivel global)
server_tokens off;

# ── Upstream — Gunicorn ───────────────────────────────────────────────────────
upstream gunicorn_biblioteca {
    server unix:/run/gunicorn/biblioteca_jp.sock fail_timeout=0;
}


# =============================================================================
# 1. HTTP → HTTPS  (redireccion permanente)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ministeriopozodejacob.cl www.ministeriopozodejacob.cl;

    # Solo el challenge de Certbot pasa por HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.ministeriopozodejacob.cl$request_uri;
    }
}


# =============================================================================
# 2. Apex sin www → www  (HTTPS)
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ministeriopozodejacob.cl;

    ssl_certificate     /etc/letsencrypt/live/www.ministeriopozodejacob.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ministeriopozodejacob.cl/privkey.pem;

    return 301 https://www.ministeriopozodejacob.cl$request_uri;
}


# =============================================================================
# 3. Servidor principal — HTTPS www
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ministeriopozodejacob.cl;

    # ── SSL / TLS ─────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/www.ministeriopozodejacob.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ministeriopozodejacob.cl/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.ministeriopozodejacob.cl/chain.pem;

    # Solo TLS 1.2 y 1.3 (elimina 1.0 y 1.1 obsoletos)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Ciphers modernos — ECDHE + AES-GCM / ChaCha20
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;   # TLS 1.3 elige el cipher del cliente

    # Sesión SSL — mejora rendimiento del handshake
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;         # Evita ataques de reutilización de tickets

    # OCSP Stapling — verifica revocación del certificado sin contactar a la CA
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Paths ─────────────────────────────────────────────────────────────────
    root /var/www/biblioteca_jp;
    access_log /var/log/nginx/biblioteca_jp_access.log;
    error_log  /var/log/nginx/biblioteca_jp_error.log warn;

    # ── Límites de carga ──────────────────────────────────────────────────────
    client_max_body_size 512M;   # Carga masiva de ZIPs de libros
    client_body_timeout  120s;
    send_timeout         120s;

    # ── Cabeceras de seguridad HTTP ───────────────────────────────────────────
    # HSTS — fuerza HTTPS por 1 año, incluye subdominios y preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Clickjacking — Django ya envía X-Frame-Options: DENY, duplicar no daña
    add_header X-Frame-Options "DENY" always;

    # Sniffing de tipos MIME
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer
    add_header Referrer-Policy "same-origin" always;

    # COOP
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Permissions Policy — deshabilita APIs que la app no necesita
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

    # NOTA: Content-Security-Policy la añade el middleware Django (SecurityHeadersMiddleware)
    # para que pueda incluir nonces dinámicos en el futuro. No duplicar aquí.

    # ── Archivos estáticos y media (servidos directamente por Nginx) ──────────
    location /static/ {
        alias /var/www/biblioteca_jp/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/biblioteca_jp/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Proxy hacia Gunicorn ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://gunicorn_biblioteca;
        proxy_redirect     off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_buffer_size          16k;
        proxy_buffers              8 32k;
        proxy_busy_buffers_size    64k;
    }

    # ── Proteger archivos sensibles ───────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.(py|pyc|env|sqlite3|log|cfg|ini|conf)$ {
        deny all;
    }
}
